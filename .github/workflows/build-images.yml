name: Build and publish Docker images

# Builds the PorteJunes backend and frontend release images and pushes them to
# the GitHub Container Registry:
#
#   push of a `v*` git tag -> :x.y.z and :latest images, built for PROD_DOMAIN_NAME
#
# The dev environment and the pull request previews are not built here anymore:
# Coolify builds them itself from docker-compose.coolify.yml (see the README).
#
# The frontend values are inlined by Vite at build time, which is why the
# target domain has to be known here and not at deployment time. The
# PROD_DOMAIN_NAME repository variable must be set: there is no default.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Select the target environment
        id: env
        run: |
          domain="${{ vars.PROD_DOMAIN_NAME }}"; var=PROD_DOMAIN_NAME; app_name="PorteJunes"
          if [ -z "$domain" ]; then
            echo "::error::The $var repository variable is not set (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          echo "domain=$domain" >> "$GITHUB_OUTPUT"
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/portejunes-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/${{ matrix.component }}.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Ignored by the backend image, which takes no build argument
          build-args: |
            VITE_APP_NAME=${{ steps.env.outputs.app_name }}
            VITE_APP_LANG=fr
            VITE_BACKEND_URL=https://${{ steps.env.outputs.domain }}/api/
            VITE_CLIENT_ID=https://${{ steps.env.outputs.domain }}/api/app
            VITE_SHAPE_REPOSITORY_URL=${{ vars.SHAPE_REPOSITORY_URL || 'https://shapes.activitypods.org/' }}
            # Set the POD_PROVIDER_BASE_URL repository variable to restrict the login page to
            # a single Pod provider. Unset, it lists the public providers and lets the user pick.
            VITE_POD_PROVIDER_URL=${{ vars.POD_PROVIDER_BASE_URL }}
            # Unset hides the "Soutenir cette application" link
            VITE_DONATION_URL=${{ vars.DONATION_URL }}
            # Duniter / Ğ1: Ğ1-Test (fake money) unless the DUNITER_* repository variables say
            # otherwise -- only switch to mainnet (g1) once the app is tested and ready.
            VITE_DUNITER_NETWORK=${{ vars.DUNITER_NETWORK || 'g1-test' }}
            VITE_DUNITER_RPC_ENDPOINTS=${{ vars.DUNITER_RPC_ENDPOINTS || 'wss://gtest.1000i100.fr,wss://gtest.asycn.io/ws/,wss://gtest.cgeek.fr,wss://gt.p2p.legal/ws' }}
            VITE_DUNITER_INDEXER_URL=${{ vars.DUNITER_INDEXER_URL || 'https://squid.gtest.coinduf.eu/v1/graphql' }}
            VITE_DUNITER_SS58_FORMAT=${{ vars.DUNITER_SS58_FORMAT || '4450' }}
