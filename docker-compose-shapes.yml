services:
  # Serves this app's own shapetree (g1:WalletSecret), from shapes/dist. It has to be its own
  # origin -- not the backend's, not the frontend's -- see backend/.env for why.
  shapes:
    image: nginx:alpine
    container_name: portejunes-shapes
    volumes:
      - ./shapes/dist:/usr/share/nginx/html:ro
      - ./shapes/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3005:80"
