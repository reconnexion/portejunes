server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Fetched cross-origin, directly from the browser, by the frontend (and by any Pod provider
    # resolving this app's shapetree) -- plain nginx sends no CORS headers by default, which the
    # browser then blocks client-side with a bare "NetworkError"/"Failed to fetch", no HTTP status
    # to debug from. shapes.activitypods.org (the shared shape repository this mirrors locally)
    # is world-readable the same way.
    add_header 'Access-Control-Allow-Origin' '*' always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }
}
